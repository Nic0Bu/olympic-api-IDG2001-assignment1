services:
  - type: web
    name: olympic-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python startup.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: olympic-db
          property: connectionString

databases:
  - name: olympic-db
    plan: free
